name: Build ES-DE-MAD AppImage

# This file MUST exist on BOTH branches of mmadalone/mad (keep them identical):
#   - main          (default branch)  -> makes the manual "Run workflow" dispatch
#                                         button/API available (workflow_dispatch only
#                                         surfaces from the default branch).
#   - deck-patches  (the ES-DE fork)  -> enables auto-build on push to the fork
#                                         (a push-triggered workflow is read from the
#                                         pushed branch, so it must live there too).
# The job ALWAYS checks out deck-patches, so it builds the patched ES-DE 3.4.1 fork
# no matter which branch the YAML was read from. main carries no ES-DE source.

on:
  workflow_dispatch:          # manual "Run workflow" button + REST/curl dispatch
  push:
    branches: [deck-patches]  # auto-build when the fork tree changes
                              # (this half only fires for the copy living on deck-patches)
    paths-ignore:             # docs-only changes don't need a ~30-min rebuild
      - '**.md'

# This is a PUBLISH job, not PR-CI: do NOT cancel an in-flight run, or a second
# trigger could abort the release upload and leave a missing/truncated asset.
concurrency:
  group: build-appimage
  cancel-in-progress: false

# softprops/action-gh-release writes a Release -> the job token needs contents: write.
permissions:
  contents: write

jobs:
  build:
    # Pin 22.04 (glibc 2.35). A binary linked here RUNS on SteamOS 3.7 (glibc 2.41)
    # because glibc is backward-, not forward-, compatible -- so build on the OLDER
    # glibc. This mirrors the proven local Ubuntu-22.04-distrobox recipe exactly.
    # NEVER use ubuntu-latest (now 24.04 / glibc 2.39: zero margin, and it drifts).
    runs-on: ubuntu-22.04

    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"   # no usable FUSE on GH runners -> extract-and-run
      DEBIAN_FRONTEND: noninteractive

    steps:
      # Build target = the FORK tree. fetch-depth: 0 pulls full history + all tags,
      # so base/v3.4.1 is present for the patch-commit report below.
      - name: Checkout deck-patches (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: deck-patches
          fetch-depth: 0

      - name: Report build target
        run: |
          echo "On $(git rev-parse --abbrev-ref HEAD) @ $(git describe --tags --always 2>/dev/null || echo unknown)"
          echo "Patch commits on top of base/v3.4.1:"
          git log --oneline base/v3.4.1..HEAD 2>/dev/null | sed 's/^/    /' || echo "  (base/v3.4.1 tag not found)"

      # Cross-branch contract gate. MAD ships in two halves that update independently: this
      # binary reaches a Deck automatically through the in-app updater, while the scripts on
      # `main` arrive only when someone runs git pull by hand. Publishing a binary that needs
      # scripts NOT yet on main is the run-50 incident - the panel shipped features whose
      # backend methods were undeployed, and every affected Deck found out by the feature
      # erroring. Catch it here, in 30 seconds, instead of on the device.
      #
      # MAD_SCRIPTS_MIN_REV (this branch) = what the binary needs. SCRIPTS_REV (main) = what
      # is deployable. Push scripts FIRST, then the binary. An absent MadScripts.h means an
      # older deck-patches with no such demand, so it skips rather than failing the build.
      - name: Gate on the script-revision contract
        run: |
          HDR=es-app/src/guis/mad/MadScripts.h
          if [ ! -f "$HDR" ]; then
            echo "no $HDR on this branch - no script demand to check"; exit 0
          fi
          MIN=$(sed -n 's/.*MAD_SCRIPTS_MIN_REV *{ *\([0-9][0-9]*\) *}.*/\1/p' "$HDR" | head -1)
          if [ -z "$MIN" ]; then
            echo "::error::$HDR present but MAD_SCRIPTS_MIN_REV is unreadable - refusing to guess"; exit 1
          fi
          # Fetch main explicitly rather than assuming the checkout left a usable
          # origin/main behind; FETCH_HEAD is then unambiguous. A FAILED fetch must not be
          # swallowed: falling through with HAVE=0 would report an infrastructure problem
          # as a contract violation, sending someone to bump a number that was already
          # correct. Say which of the two actually happened.
          if ! git fetch --depth=1 origin main >/dev/null 2>&1; then
            echo "::error::Could not fetch origin/main, so the script-revision contract"
            echo "::error::could not be checked. This is an INFRASTRUCTURE failure, not a"
            echo "::error::contract violation - re-run the job."
            exit 1
          fi
          HAVE=$(git show FETCH_HEAD:SCRIPTS_REV 2>/dev/null | awk 'NR==1{print $1+0}')
          if [ -z "$HAVE" ]; then
            echo "::error::main has no readable SCRIPTS_REV, but this build declares a"
            echo "::error::script demand ($MIN). Ship the launchers half to main first."
            exit 1
          fi
          echo "binary needs script rev >= $MIN; main has $HAVE"
          if [ "$MIN" -gt "$HAVE" ]; then
            echo "::error::This build demands script rev $MIN but main only has $HAVE."
            echo "::error::Push the launchers half to main FIRST, then rebuild. Publishing"
            echo "::error::now would ship a panel whose backend methods are not deployed."
            exit 1
          fi
          echo "script-revision contract OK"

      # The exact dep list from ~/esde-build/ubuntu-build.sh (Jammy names), plus the
      # three libs linuxdeploy bundles by name (libOpenGL/libGLdispatch via libopengl0
      # + libglvnd0; libgio via libglib2.0-0) -- implicit -dev Depends today, named
      # explicitly so a future packaging change can't silently break the bundle step.
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential git cmake gettext wget file patchelf desktop-file-utils squashfs-tools libfuse2 ca-certificates \
            libharfbuzz-dev libicu-dev libsdl2-dev libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libfreeimage-dev libfreetype6-dev libgit2-dev libcurl4-openssl-dev libpugixml-dev libasound2-dev \
            libbluetooth-dev libgl1-mesa-dev libpoppler-cpp-dev \
            libpipewire-0.3-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev libudev-dev \
            libopengl0 libglvnd0 libglib2.0-0

      # Call the UPSTREAM recipe VERBATIM so CI == the proven local build. It downloads
      # appimagetool + linuxdeploy, builds SDL 2.32.10 (aborts unless PipeWire is
      # detected), cmake -DAPPIMAGE_BUILD=on -DBUNDLED_CERTS=on -DSTEAM_DECK=on, make,
      # bundles the host libs + SDL, and emits ES-DE_x64_SteamDeck.AppImage in cwd.
      # The recipe's own failure gates use bare `exit` (status 0), so assert the
      # artifact here -- otherwise a recipe abort would go GREEN and fail cryptically
      # in a later step.
      - name: Build AppImage (upstream recipe, unmodified)
        env:
          # Read by CMake (deck-patches block) for the in-app updater's
          # release comparison — the recipe itself stays verbatim.
          MAD_RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          bash tools/create_AppImage_SteamDeck.sh
          test -f ES-DE_x64_SteamDeck.AppImage \
            || { echo "::error::recipe produced no AppImage (check cwd/.clang-format guard or SDL PipeWire detection above)"; exit 1; }

      # Rename (CI-only, not a recipe edit) to the asset name the Deck expects, and
      # publish a checksum companion for integrity verification on the Deck.
      - name: Rename + checksum
        run: |
          mv ES-DE_x64_SteamDeck.AppImage ES-DE-MAD.AppImage
          chmod +x ES-DE-MAD.AppImage
          sha256sum ES-DE-MAD.AppImage | tee ES-DE-MAD.AppImage.sha256
          ls -la ES-DE-MAD.AppImage
          file ES-DE-MAD.AppImage

      # In-app updater feed: ES-DE's exact latest_release.json schema, with the
      # CI run number as the release number (compared against MAD_RELEASE_NUMBER
      # baked into the binary above).
      #
      # The per-package "message" is the ONLY place the update popup can say what
      # changed: ApplicationUpdater parses it, truncates it and appends it under the
      # version line. It used to be "" so the popup was a bare one-liner.
      #
      # Built by python from a QUOTED heredoc, with the commit subjects arriving on
      # STDIN, so no shell ever sees commit text. That is not tidiness - the previous
      # unquoted `cat <<EOF` performed parameter expansion and command substitution on
      # whatever a commit subject contained, inside a step holding a contents:write
      # token. Four hazards become structurally impossible rather than filtered:
      #   * shell expansion / $(...) / backticks -> the shell never sees the text
      #   * `"` in a subject (16 of 212 today)   -> json.dump escapes by construction
      #   * multibyte subjects (27 of 212)       -> ES-DE truncates to 280 BYTES with
      #     substr, so ASCII-folding makes a mid-codepoint cut (U+FFFD) unreachable
      #   * GuiMsgBox has no height clamp        -> a hard cap keeps the buttons on
      #     screen after the popup uppercases the whole string
      - name: Generate latest_release.json
        env:
          RUN: ${{ github.run_number }}
        run: |
          # Commit text goes shell -> FILE -> python. Never through the shell as data,
          # and never on stdin either: `python3 - <<'PY'` already uses stdin for the
          # program itself, so piping the log in would feed python its own source.
          git log --pretty=format:'%s' base/v3.4.1..HEAD > mad-subjects.txt 2>/dev/null || : > mad-subjects.txt
          MD5="$(md5sum ES-DE-MAD.AppImage | cut -d' ' -f1)" \
          DATE="$(date +%Y-%m-%d)" \
          SUBJECTS=mad-subjects.txt \
          python3 - > latest_release.json <<'PY'
          import json, os, re, sys, unicodedata

          # Budgets sized to the dialog, which now uses ~92% of the screen width at the
          # small font and scrolls if it still overflows. 54 chars was tuned for the old
          # narrow box and truncated almost every subject with an ellipsis, which is what
          # made the changelog unreadable. ES-DE's own substr(0, 280) counts BYTES, so the
          # total stays under that with margin - ASCII-only output keeps bytes == chars.
          MAX_TOTAL, MAX_LINE, KEEP = 260, 76, 3

          def clean(s):
              # ASCII-fold FIRST: ES-DE truncates the message to 280 BYTES with substr,
              # so an ASCII-only string can never be cut mid-codepoint.
              s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode()
              s = re.sub(r"[\x00-\x1f\x7f]", " ", s)
              s = re.sub(r"\s+", " ", s).strip()
              if len(s) <= MAX_LINE:
                  return s
              # Cut on a word boundary - the popup uppercases this and a mid-word stub
              # reads as a typo rather than as truncation.
              cut = s[:MAX_LINE]
              if " " in cut:
                  cut = cut[:cut.rfind(" ")]
              return cut.rstrip(" ,;:-") + "..."

          run = os.environ.get("RUN", "0")
          try:
              with open(os.environ["SUBJECTS"], encoding="utf-8", errors="replace") as fh:
                  raw = fh.read().splitlines()
          except OSError:
              raw = []

          header = f"Build {run}:"
          lines, total = [header], len(header)
          for subject in (c for c in (clean(l) for l in raw) if c):
              if len(lines) > KEEP:
                  break
              entry = "- " + subject
              if total + 1 + len(entry) > MAX_TOTAL:
                  break
              lines.append(entry)
              total += 1 + len(entry)
          # A lone header says nothing; leave the field empty so the popup stays as it was.
          message = "\n".join(lines) if len(lines) > 1 else ""

          doc = {
              "stable": {
                  "version": f"3.4.1-mad.{run}",
                  "release": run,
                  "date": os.environ["DATE"],
                  "packages": [{
                      "name": "LinuxSteamDeckAppImage",
                      "filename": "ES-DE-MAD.AppImage",
                      "url": "https://github.com/mmadalone/mad/releases/download/"
                             "latest-steamdeck/ES-DE-MAD.AppImage",
                      "md5": os.environ["MD5"],
                      "message": message,
                  }],
              },
              "prerelease": {"version": "", "release": "", "date": "", "packages": []},
          }
          json.dump(doc, sys.stdout)
          PY
          rm -f mad-subjects.txt
          python3 -m json.tool latest_release.json

      # Publish/overwrite assets on a single fixed ROLLING tag so the Deck always pulls
      # /releases/latest with no version logic. action-gh-release creates the tag/release
      # if absent and overwrites assets on re-run. Uses the auto GITHUB_TOKEN.
      - name: Generate release notes (fork changelog)
        run: |
          {
            echo "Patched ES-DE 3.4.1 (MAD fork) AppImage — built on ubuntu-22.04 (glibc 2.35)."
            echo ""
            echo "**Build:** run ${{ github.run_number }} · commit \`${{ github.sha }}\`"
            echo ""
            echo "### Fork patches in this build"
            echo "_(\`git log base/v3.4.1..HEAD\`, newest first)_"
            echo ""
            git log --pretty=format:'- %s (%h)' base/v3.4.1..HEAD 2>/dev/null \
              || echo "- (base/v3.4.1 tag not found)"
          } > release-notes.md
          cat release-notes.md

      - name: Publish AppImage as Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-steamdeck
          name: ES-DE-MAD (Steam Deck, latest)
          body_path: release-notes.md
          files: |
            ES-DE-MAD.AppImage
            ES-DE-MAD.AppImage.sha256
            latest_release.json
          # Rolling asset: do NOT claim GitHub's "Latest" badge -- that belongs to the
          # versioned tags (e.g. v0.3.0). The Deck fetches this AppImage by the
          # latest-steamdeck TAG (deck-fetch-esde.sh + the in-app updater), never
          # /releases/latest, so make_latest=false changes nothing about delivery.
          make_latest: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
